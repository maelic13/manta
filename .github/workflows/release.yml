name: Release
run-name: ${{ github.ref_type == 'tag' && github.ref_name || format('release candidate {0}', github.sha) }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate version, changelog and fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      version: ${{ steps.meta.outputs.version }}
      expected_nodes: ${{ steps.meta.outputs.expected_nodes }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git fetch origin master
            python3 tools/ci/release_check.py check "$GITHUB_REF_NAME" --base origin/master --notes release-notes.md
            mode=release
            version="${GITHUB_REF_NAME#v}"
          else
            mode=candidate
            version="$(python3 tools/ci/release_check.py version)"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              python3 tools/ci/release_check.py check "v$version" --base HEAD --notes release-notes.md
            else
              echo "Candidate build of $GITHUB_SHA at version $version; nothing is published." > release-notes.md
            fi
          fi
          expected="$(python3 tools/ci/release_check.py fingerprint)"
          test -n "$expected"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "expected_nodes=$expected" >> "$GITHUB_OUTPUT"
          echo "mode $mode, version $version, expected bench-6 nodes $expected"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86-64
            suffix: linux-x86-64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
            suffix: linux-arm64
          - runner: windows-2025
            label: windows-x86-64
            suffix: windows-x86-64.exe
          - runner: windows-11-arm
            label: windows-arm64
            suffix: windows-arm64.exe
          - runner: macos-26-intel
            label: macos-x86-64
            suffix: macos-x86-64
          - runner: macos-26
            label: macos-arm64
            suffix: macos-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: ./.github/actions/setup-zig
        timeout-minutes: 6

      - name: Build portable release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          zig build dist -Dportable -Dversion="$version"
          mkdir -p release-output
          built="zig-out/dist/manta-v${version}-${{ matrix.suffix }}"
          test -f "$built"
          cp "$built" "release-output/$(basename "$built")"

      - name: Smoke-test and fingerprint executable
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          expected="${{ needs.prepare.outputs.expected_nodes }}"
          binary="release-output/manta-v${version}-${{ matrix.suffix }}"
          interpreter=python3
          command -v python3 >/dev/null || interpreter=python
          "$interpreter" tools/ci/release_smoke.py "$binary" "$version" "release-output/bench-${{ matrix.label }}.txt"
          nodes="$(tr -d '\r\n' < "release-output/bench-${{ matrix.label }}.txt")"
          test "$nodes" = "$expected" || {
            echo "::error::bench-6 fingerprint $nodes differs from declared $expected"
            exit 1
          }

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: release-output/*
          if-no-files-found: error

  collect:
    name: Verify the complete matrix
    needs: [prepare, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require every build
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 1 || 0 }}

      - name: Download release candidates
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-output

      - name: Require six assets and one fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.prepare.outputs.expected_nodes }}"
          shopt -s nullglob
          files=(release-output/bench-*.txt)
          test "${#files[@]}" -eq 6
          for file in "${files[@]}"; do
            value=$(<"$file")
            value=${value%$'\r'}
            [[ "$value" =~ ^[0-9]+$ ]]
            echo "$file: $value"
            test "$value" = "$expected"
          done

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          for asset in \
            "manta-v${version}-linux-x86-64" \
            "manta-v${version}-linux-arm64" \
            "manta-v${version}-windows-x86-64.exe" \
            "manta-v${version}-windows-arm64.exe" \
            "manta-v${version}-macos-x86-64" \
            "manta-v${version}-macos-arm64"; do
            test -f "release-output/$asset"
            folder="${asset%.exe}"
            mkdir -p "$folder"
            cp "release-output/$asset" "$folder/$asset"
            cp LICENSE "$folder/LICENSE.txt"
            cp third_party/fathom/LICENSE "$folder/LICENSE-Fathom.txt"
            cp README.md "$folder/README.md"
            cp CHANGELOG.md "$folder/CHANGELOG.md"
            if [[ "$asset" == *.exe ]]; then
              zip -r "dist/$folder.zip" "$folder"
            else
              chmod +x "$folder/$asset"
              tar -czf "dist/$folder.tar.gz" "$folder"
            fi
            rm -rf "$folder"
          done
          cd dist
          test "$(ls | wc -l)" -eq 6
          sha256sum ./* | sed 's# \./# #' | tee SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          ls -la

      - name: Upload packaged bundle
        uses: actions/upload-artifact@v7
        with:
          name: manta-${{ needs.prepare.outputs.mode }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.mode == 'candidate' && 30 || 90 }}

  publish:
    name: Publish the release
    if: needs.prepare.outputs.mode == 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on release line
        run: |
          git fetch origin master
          python3 tools/ci/release_check.py line "$GITHUB_REF_NAME" --base origin/master

      - name: Download packaged bundle
        uses: actions/download-artifact@v7
        with:
          name: manta-release-${{ github.sha }}
          path: bundle

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes

      - name: Recheck bundle checksums
        run: cd bundle && sha256sum --check SHA256SUMS

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundle/manta-v*.zip bundle/manta-v*.tar.gz bundle/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Manta ${{ needs.prepare.outputs.version }}" \
            --notes-file notes/release-notes.md
