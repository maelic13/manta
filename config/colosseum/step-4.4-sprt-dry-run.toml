# Qualification-only finite SPRT design. Step 4.4 permits dry-run resolution,
# not a live strength test; later candidates must register their own design.

[options]
max-pairs = 2
preset = "gainer"
a-label = "manta-candidate"
b-label = "manta-baseline"
a-option = ["Hash=64"]
b-option = ["Hash=64"]
a-nodes = 500
b-nodes = 500
no-draw-adjudication = true
no-resign-adjudication = true
max-moves = 40
max-engine-faults = 0
max-time-losses = 0
concurrency = 1
placement = "off"
memory-budget-mb = 256
book = "step-4.4-openings.epd"
book-order = "sequential"
book-start = 0
seed = 440044
progress-interval-secs = 1
