# MAN-S03 authoritative coarse 1T promotion gate. The accepted CLI 0.1.0
# boundary requires candidate-as-A and forbids the normal finer [3,10] design.

command = ["sprt"]
positionals = [
  "../../zig-out/candidates/MAN-S03-null-move/manta-candidate.exe",
  "../../zig-out/candidates/MAN-S03-null-move/manta-baseline.exe",
]

[options]
max-pairs = 6000
model = "normalized"
elo0 = 5
elo1 = 20
alpha = 0.05
beta = 0.05
a-label = "manta-null-move-candidate"
b-label = "manta-phase-5.0-baseline"
